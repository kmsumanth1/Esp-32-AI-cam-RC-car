name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  python:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: detection
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      # ultralytics/torch are not needed: the detector is imported lazily and faked in tests
      - run: pip install fastapi httpx pytest ruff SQLAlchemy requests numpy opencv-python-headless
      - run: ruff check .
      - run: python -m pytest -q

  firmware:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: arduino/setup-arduino-cli@v2
      - name: Install board cores
        run: |
          arduino-cli config init
          arduino-cli config add board_manager.additional_urls https://espressif.github.io/arduino-esp32/package_esp32_index.json
          arduino-cli core update-index
          arduino-cli core install arduino:avr
          arduino-cli core install esp32:esp32
      - name: Compile Arduino Uno sketch
        run: arduino-cli compile --fqbn arduino:avr:uno arduino_uno
      - name: Compile ESP32-CAM sketch
        run: |
          cp esp32_cam/secrets.h.example esp32_cam/secrets.h
          arduino-cli compile --fqbn esp32:esp32:esp32cam esp32_cam
