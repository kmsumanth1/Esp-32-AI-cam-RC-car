# Detection server + MySQL for detection history.
#   cp .env.example .env     (set ESP32_HOST to the ESP32-CAM's IP)
#   docker compose up --build
services:
  mysql:
    image: mysql:8.0
    environment:
      MYSQL_DATABASE: rccar
      MYSQL_USER: rc
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:-change-me}
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-change-me-too}
    volumes:
      - mysql-data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      interval: 5s
      timeout: 5s
      retries: 20

  detection:
    build: ./detection
    environment:
      ESP32_HOST: ${ESP32_HOST:?Set ESP32_HOST in .env}
      DATABASE_URL: mysql+pymysql://rc:${MYSQL_PASSWORD:-change-me}@mysql:3306/rccar
    ports:
      - "8000:8000"
    depends_on:
      mysql:
        condition: service_healthy

volumes:
  mysql-data:
